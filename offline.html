<!DOCTYPE html>
<html lang="en-IN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Bandwar Archive</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1a1a18">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1a18'/><text x='50' y='68' font-family='Georgia' font-size='60' fill='%23f7f5ef' text-anchor='middle'>B</text></svg>">

<style>
  :root {
    --c-primary: #1a1a18;
    --c-base:    #f7f5ef;
    --c-surface: #efece4;
    --c-accent:  #1f3d2f;
    --c-text:    var(--c-primary);
    --c-text-muted: #4a4a44;
    --c-bg:      var(--c-base);
    --c-bg-alt:  var(--c-surface);
    --c-border:  #d4d0c4;
    --f-display: Georgia, 'Times New Roman', serif;
    --f-body:    -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --f-mono:    'SF Mono', Monaco, 'Courier New', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--f-body);
    background: var(--c-bg);
    color: var(--c-text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    line-height: 1.6;
  }

  .offline-wrap {
    max-width: 520px;
    text-align: center;
  }

  .offline-icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    line-height: 1;
  }

  h1 {
    font-family: var(--f-display);
    font-size: clamp(1.75rem, 5vw, 2.5rem);
    font-weight: 500;
    letter-spacing: -0.02em;
    margin-bottom: 1rem;
    color: var(--c-text);
  }

  p {
    color: var(--c-text-muted);
    font-size: 1.0625rem;
    margin-bottom: 1.5rem;
  }

  .offline-meta {
    display: inline-block;
    font-family: var(--f-mono);
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--c-accent);
    padding: 0.5rem 1rem;
    border: 1px solid var(--c-accent);
    border-radius: 2px;
    margin-bottom: 2rem;
  }

  .offline-actions {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  a.btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    font-size: 0.875rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    border: 1px solid var(--c-text);
    color: var(--c-text);
    text-decoration: none;
    border-radius: 4px;
    transition: all 0.2s ease;
    min-height: 2.75rem;
  }

  a.btn:hover {
    background: var(--c-text);
    color: var(--c-bg);
  }

  a.btn-primary {
    background: var(--c-text);
    color: var(--c-bg);
  }

  a.btn-primary:hover {
    background: var(--c-accent);
    border-color: var(--c-accent);
    color: var(--c-base);
  }

  .offline-note {
    margin-top: 2.5rem;
    padding-top: 2rem;
    border-top: 1px solid var(--c-border);
    font-size: 0.875rem;
    color: var(--c-text-muted);
  }

  .offline-note a {
    color: var(--c-accent);
    text-decoration: underline;
    text-underline-offset: 2px;
  }
</style>
</head>

<body>
  <div class="offline-wrap">

    <div class="offline-icon" aria-hidden="true">📡</div>

    <span class="offline-meta">Offline</span>

    <h1>You're offline</h1>

    <p>
      The Bandwar Archive isn't reachable right now.
      Please check your internet connection and try again.
    </p>

    <div class="offline-actions">
      <a href="/" class="btn btn-primary">Try again</a>
      <a href="/section" class="btn">Cached pages</a>
    </div>

    <div class="offline-note">
      Some pages you've visited before may still be available offline.
      <br>
      <a href="mailto:bandwar.archive@gmail.com">Contact the archive</a>
    </div>

  </div>

  <script>
    // Auto-reload when connection returns
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
