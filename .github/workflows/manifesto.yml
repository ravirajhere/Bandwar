name: Generate Manifesto PDF

on:
  push:
    branches: [main]
    paths:
      - 'data/vision.json'
      - 'templates/vision.html'
      - 'scripts/generate-manifesto.cjs'
      - '.github/workflows/manifesto.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifesto:
    name: Generate PDF
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Generate manifesto PDF
        run: node scripts/generate-manifesto.cjs

      - name: Commit PDF
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/pdfs/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerate manifesto PDF [skip ci]"
            git push
          else
            echo "No PDF changes"
          fi
        continue-on-error: true

      - name: Summary
        run: |
          echo "## Manifesto PDF" >> $GITHUB_STEP_SUMMARY
          echo "- **Generated:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          ls -lh assets/pdfs/ 2>/dev/null || echo "No PDFs" >> $GITHUB_STEP_SUMMARY