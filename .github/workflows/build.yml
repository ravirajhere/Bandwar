name: Build Site

on:
  push:
    branches: [main]
    paths:
      - 'data/master.json'
      - 'data/content.json'
      - 'data/media.json'
      - 'templates/**'
      - 'css/**'
      - 'js/**'
      - 'scripts/build.cjs'
      - 'scripts/validate.cjs'
      - 'scripts/generate-sitemaps.cjs'
      - 'package.json'
      - '.github/workflows/build.yml'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate (informational)
        run: node scripts/validate.cjs || true
        continue-on-error: true

      - name: Build static site
        run: node scripts/build.cjs --clean

      - name: Generate sitemaps
        run: node scripts/generate-sitemaps.cjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
        continue-on-error: true

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          if [ -d "dist" ]; then
            PAGES=$(find dist -name "*.html" | wc -l)
            echo "- **Pages built:** $PAGES" >> $GITHUB_STEP_SUMMARY
          fi