name: Fetch Fonts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch fonts
        run: node scripts/fetch-fonts.cjs

      - name: Commit fonts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: fetch self-hosted fonts [skip ci]"
          git push