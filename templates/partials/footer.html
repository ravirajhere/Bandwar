<footer class="footer" role="contentinfo">
  <div class="container-wide">
    <div class="footer-grid">

      <div class="footer-brand-col">
        <div class="footer-brand">{{siteFullName}}</div>
        <p class="footer-desc">{{siteDescription}}</p>

        {{socialLinks}}

        <address class="footer-address" aria-label="Village location">
          <span class="footer-address-line">
            📍 {{villageName}}, {{villageDistrict}}
          </span>
          <span class="footer-address-line">
            {{villageState}}, India — {{villagePincode}}
          </span>
          <a href="mailto:{{contactEmail}}" class="footer-email">
            ✉️ {{contactEmail}}
          </a>
        </address>
      </div>

      <div class="footer-col">
        <h4>Sections</h4>
        <ul>
          {{footerSections}}
        </ul>
      </div>

      <div class="footer-col">
        <h4>Explore</h4>
        <ul>
          {{footerExplore}}
        </ul>
      </div>

    </div>

    <div class="footer-bottom">
      <span>{{footerCopyright}}</span>
      <span class="footer-credit">{{footerCredit}}</span>
    </div>
  </div>
</footer>
