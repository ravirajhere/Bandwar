<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="{{themeColor}}">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{keywords}}
<link rel="canonical" href="{{canonical}}">

<meta name="robots" content="{{robots}}">
<meta name="googlebot" content="{{robots}}">
<meta name="googlebot-image" content="index, follow">
<meta name="bingbot" content="index, follow">

<link rel="alternate" hreflang="{{lang}}" href="{{canonical}}">
<link rel="alternate" hreflang="x-default" href="{{canonical}}">
{{hreflangHindi}}

<meta property="og:type" content="{{ogType}}">
<meta property="og:site_name" content="{{ogSiteName}}">
<meta property="og:title" content="{{ogTitle}}">
<meta property="og:description" content="{{ogDescription}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{ogImage}}">
<meta property="og:image:width" content="{{ogImageWidth}}">
<meta property="og:image:height" content="{{ogImageHeight}}">
<meta property="og:image:alt" content="{{ogImageAlt}}">
<meta property="og:locale" content="{{ogLocale}}">

<meta name="twitter:card" content="{{twitterCard}}">
<meta name="twitter:title" content="{{twitterTitle}}">
<meta name="twitter:description" content="{{twitterDescription}}">
<meta name="twitter:image" content="{{twitterImage}}">
<meta name="twitter:image:alt" content="{{ogImageAlt}}">
{{twitterSite}}

<meta name="google-site-verification" content="{{verificationGoogle}}">

<link rel="icon" href="{{faviconSvg}}">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="manifest" href="{{manifestUrl}}">

<!-- Self-hosted fonts preload (replaces Google Fonts) -->
<link rel="preload" as="font" type="font/woff2" href="/fonts/inter-latin-wght-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-latin-wght-normal.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-mono-latin-400-normal.woff2" crossorigin>

<link rel="preload" as="style" href="{{themeCss}}">
<link rel="preload" as="style" href="{{styleCss}}">
<link rel="stylesheet" href="{{themeCss}}">
<link rel="stylesheet" href="{{styleCss}}">
{{pageSpecificHead}}

{{preloadImages}}

<script type="application/ld+json" data-prerendered="true">
{{schema}}
</script>
