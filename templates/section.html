<header class="section-head-page">
  <div class="container-wide">

    <span class="section-num">{{sectionEyebrow}}</span>
    <h1 class="section-title" id="section-title">{{sectionTitle}}</h1>

    {{sectionIntroBlock}}

    <span class="section-count" id="section-count">{{sectionCount}}</span>

    <div class="section-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="search"
             id="section-search"
             placeholder="Search articles — try 'mandir', 'school', '1942'…"
             aria-label="Search articles"
             autocomplete="off"
             value="{{searchValue}}">
    </div>

    <div class="section-filters" id="section-filters" role="group" aria-label="Filter by category">
      {{filterChips}}
    </div>

  </div>
</header>

<section class="section-sm">
  <div class="container-wide">
    <div class="section-grid" id="section-grid">
      {{articlesGrid}}
    </div>

    {{emptyState}}
    {{pagination}}
  </div>
</section>
