<header class="time-head">
  <div class="container-wide">
    <span class="section-num">History</span>
    <h1 class="time-title">{{timeTitle}}</h1>
    <p class="time-intro">{{timeIntro}}</p>

    <div class="time-stats">
      {{timeStats}}
    </div>

    <div class="time-filters" id="time-filters" role="group" aria-label="Filter by era">
      {{eraFilters}}
    </div>
  </div>
</header>

<section class="time-timeline">
  <div class="container-text">
    {{erasContainer}}
  </div>
</section>
